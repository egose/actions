name: Install asdf tools
description: Install asdf tools based on the .tool-versions file and additional plugins

inputs:
  version:
    description: The version of asdf
    default: v0.20.0
    required: false
  plugins:
    description: Newline-separated list of additional plugins (e.g., <plugin>=<url>)
    required: false
  update-plugins:
    description: Update installed asdf plugin definitions before installing tools
    default: 'false'
    required: false
  context:
    description: Directory of the file .tool-versions located
    default: .
    required: false

runs:
  using: composite
  steps:
  - name: Install asdf
    run: bash "${{ github.action_path }}/../asdf-install/install.sh"
    shell: bash
    env:
      ASDF_VERSION: ${{ inputs.version }}

  - name: Cache tools
    # See https://github.com/actions/cache/commits/main/
    uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
    with:
      path: ~/.asdf
      key: asdf-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ hashFiles(format('{0}/.tool-versions', inputs.context)) }}
      restore-keys: |
        asdf-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-
        asdf-${{ runner.os }}-${{ runner.arch }}-

  - name: Install asdf tools
    run: bash "${{ github.action_path }}/install.sh"
    shell: bash
    env:
      ASDF_TOOLS_CONTEXT: ${{ inputs.context }}
      ASDF_EXTRA_PLUGINS: ${{ inputs.plugins }}
      ASDF_UPDATE_PLUGINS: ${{ inputs.update-plugins }}
