name: Docker Image Build & Push
description: Build Docker image and push to a container registry

inputs:
  registry-url:
    description: Docker container registry server URL
    required: true
  registry-username:
    description: Docker container registry username
    required: false
  registry-password:
    description: Docker container registry password
    required: false
  registry-login:
    description: Log in to the container registry before publishing
    required: false
    default: 'true'
  image-name:
    description: Docker image name
    required: true
  metadata-tags:
    description: List of tags as key-value pair attributes
    required: true
  metadata-labels:
    description: List of labels as key-value pair attributes
    required: false
  metadata-annotations:
    description: List of annotations as key-value pair attributes
    required: false
  metadata-labels-annotations:
    description: List of key-value pair attributes applied to both labels and annotations
    required: false
  docker-context:
    description: Docker build's context
    required: false
  docker-file:
    description: Path to the Dockerfile
    required: false
  docker-args:
    description: List of build args as key-value pair attributes
    required: false
  docker-outputs:
    description: List of output destinations
    required: false
  publish-mode:
    description: Publication mode; direct preserves the original build-and-push behavior, gated scans a local single-platform image before pushing it
    required: false
    default: direct
  pre-push-command:
    description: Trusted shell command run against IMAGE_REF and IMAGE_CONFIG_DIGEST after the gated local build and before scanning or publishing
    required: false
  trivy:
    description: Run Trivy vulnerability scanner
    required: false
    default: 'false'
  trivy-severity:
    description: Comma-separated severities that fail a gated Trivy scan
    required: false
    default: HIGH,CRITICAL
  trivy-ignore-unfixed:
    description: Ignore vulnerabilities without fixes during a gated Trivy scan
    required: false
    default: 'true'
  trivy-sarif-file:
    description: Path for the Trivy SARIF report
    required: false
    default: trivy-results.sarif
  upload-sarif:
    description: Upload the Trivy SARIF report to GitHub code scanning
    required: false
    default: 'true'
  sbom:
    description: Generate an SPDX JSON SBOM from the gated local image
    required: false
    default: 'false'
  sbom-file:
    description: Path for the generated SPDX JSON SBOM
    required: false
    default: image-sbom.spdx.json
  attest-provenance:
    description: Create a GitHub build provenance attestation for the verified image
    required: false
    default: 'false'
  attest-sbom:
    description: Create a GitHub SBOM attestation for the verified image
    required: false
    default: 'false'
  attest-push-to-registry:
    description: Push enabled attestations to the OCI registry
    required: false
    default: 'true'
  attest-create-storage-record:
    description: Create a GitHub artifact metadata storage record for enabled attestations
    required: false
    default: 'true'

outputs:
  docker-version:
    description: Generated Docker image version
    value: ${{ steps.meta.outputs.version }}
  docker-tags:
    description: Generated Docker tags
    value: ${{ steps.meta.outputs.tags }}
  docker-labels:
    description: Generated Docker labels
    value: ${{ steps.meta.outputs.labels }}
  docker-annotations:
    description: Generated annotations
    value: ${{ steps.meta.outputs.annotations }}
  metadata-json:
    description: JSON output of tags and labels
    value: ${{ steps.meta.outputs.json }}
  bake-file-tags:
    description: Bake definition file with tags
    value: ${{ steps.meta.outputs.bake-file-tags }}
  bake-file-labels:
    description: Bake definition file with labels
    value: ${{ steps.meta.outputs.bake-file-labels }}
  bake-file-annotations:
    description: Bake definiton file with annotations
    value: ${{ steps.meta.outputs.bake-file-annotations }}
  bake-file:
    description: Bake definition file with tags and labels
    value: ${{ steps.meta.outputs.bake-file }}
  image-ref:
    description: Primary local image reference used by gated publication
    value: ${{ steps.local-image.outputs.image-ref }}
  image-config-digest:
    description: Config digest of the local image used by gated publication
    value: ${{ steps.local-image.outputs.config-digest }}
  manifest-digest:
    description: Published primary manifest digest
    value: ${{ steps.publish.outputs.manifest-digest || steps.build-direct.outputs.digest }}
  sbom-path:
    description: Path to the generated image SBOM when enabled
    value: ${{ steps.sbom-output.outputs.path }}
  provenance-attestation-id:
    description: GitHub ID of the generated provenance attestation
    value: ${{ steps.attest-provenance.outputs.attestation-id }}
  provenance-attestation-url:
    description: GitHub URL of the generated provenance attestation
    value: ${{ steps.attest-provenance.outputs.attestation-url }}
  provenance-bundle-path:
    description: Path to the generated provenance attestation bundle
    value: ${{ steps.attest-provenance.outputs.bundle-path }}
  provenance-storage-record-ids:
    description: GitHub artifact metadata storage record IDs for the provenance attestation
    value: ${{ steps.attest-provenance.outputs.storage-record-ids }}
  sbom-attestation-id:
    description: GitHub ID of the generated SBOM attestation
    value: ${{ steps.attest-sbom.outputs.attestation-id }}
  sbom-attestation-url:
    description: GitHub URL of the generated SBOM attestation
    value: ${{ steps.attest-sbom.outputs.attestation-url }}
  sbom-bundle-path:
    description: Path to the generated SBOM attestation bundle
    value: ${{ steps.attest-sbom.outputs.bundle-path }}
  sbom-storage-record-ids:
    description: GitHub artifact metadata storage record IDs for the SBOM attestation
    value: ${{ steps.attest-sbom.outputs.storage-record-ids }}

runs:
  using: composite
  steps:
  - name: Validate inputs
    env:
      ATTEST_CREATE_STORAGE_RECORD: ${{ inputs.attest-create-storage-record }}
      ATTEST_PROVENANCE: ${{ inputs.attest-provenance }}
      ATTEST_PUSH_TO_REGISTRY: ${{ inputs.attest-push-to-registry }}
      ATTEST_SBOM: ${{ inputs.attest-sbom }}
      DOCKER_OUTPUTS: ${{ inputs.docker-outputs }}
      METADATA_ANNOTATIONS: ${{ inputs.metadata-annotations }}
      METADATA_LABELS_ANNOTATIONS: ${{ inputs.metadata-labels-annotations }}
      PUBLISH_MODE: ${{ inputs.publish-mode }}
      REGISTRY_LOGIN: ${{ inputs.registry-login }}
      REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      REGISTRY_URL: ${{ inputs.registry-url }}
      REGISTRY_USERNAME: ${{ inputs.registry-username }}
      SBOM: ${{ inputs.sbom }}
    run: |
      set -euo pipefail

      case "$PUBLISH_MODE" in
        direct|gated) ;;
        *) printf 'publish-mode must be direct or gated, got %s\n' "$PUBLISH_MODE" >&2; exit 1 ;;
      esac
      case "$REGISTRY_LOGIN" in
        true|false) ;;
        *) printf 'registry-login must be true or false, got %s\n' "$REGISTRY_LOGIN" >&2; exit 1 ;;
      esac
      for value in "$ATTEST_PROVENANCE" "$ATTEST_SBOM" "$ATTEST_PUSH_TO_REGISTRY" "$ATTEST_CREATE_STORAGE_RECORD"; do
        case "$value" in
          true|false) ;;
          *) printf 'attestation inputs must be true or false, got %s\n' "$value" >&2; exit 1 ;;
        esac
      done
      case "$REGISTRY_URL" in
        ''|*://*|*/) printf 'registry-url must be a registry host without a scheme or trailing slash, got %s\n' "$REGISTRY_URL" >&2; exit 1 ;;
      esac
      if [[ "$REGISTRY_LOGIN" == true && ( -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ) ]]; then
        printf 'registry-username and registry-password are required when registry-login is true\n' >&2
        exit 1
      fi
      if [[ "$PUBLISH_MODE" == gated && -n "$DOCKER_OUTPUTS" ]]; then
        printf 'docker-outputs is not supported in gated mode because the scanned local image must be pushed unchanged\n' >&2
        exit 1
      fi
      if [[ "$PUBLISH_MODE" == gated && ( -n "$METADATA_ANNOTATIONS" || -n "$METADATA_LABELS_ANNOTATIONS" ) ]]; then
        printf 'metadata annotations are not supported in gated mode because Docker image load does not preserve manifest annotations\n' >&2
        exit 1
      fi
      if [[ "$PUBLISH_MODE" != gated && ( "$ATTEST_PROVENANCE" == true || "$ATTEST_SBOM" == true ) ]]; then
        printf 'image attestations require publish-mode gated so they reference the verified manifest digest\n' >&2
        exit 1
      fi
      if [[ "$ATTEST_SBOM" == true && "$SBOM" != true ]]; then
        printf 'attest-sbom requires sbom to be true\n' >&2
        exit 1
      fi
      if [[ ( "$ATTEST_PROVENANCE" == true || "$ATTEST_SBOM" == true ) && "$ATTEST_PUSH_TO_REGISTRY" != true && "$ATTEST_CREATE_STORAGE_RECORD" == true ]]; then
        printf 'attest-create-storage-record requires attest-push-to-registry to be true\n' >&2
        exit 1
      fi
    shell: bash

  - name: Log in to Docker Container Registry
    if: ${{ inputs.publish-mode == 'direct' && inputs.registry-login == 'true' }}
    # See https://github.com/docker/login-action/commits/master/
    uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
    with:
      registry: ${{ inputs.registry-url }}
      username: ${{ inputs.registry-username }}
      password: ${{ inputs.registry-password }}

  - name: Extract metadata
    id: meta
    # See https://github.com/docker/metadata-action/commits/master/
    uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
    with:
      images: ${{ inputs.registry-url }}/${{ inputs.image-name }}
      tags: ${{ inputs.metadata-tags }}
      labels: |
        ${{ inputs.metadata-labels-annotations }}
        ${{ inputs.metadata-labels }}
      annotations: |
        ${{ inputs.metadata-labels-annotations }}
        ${{ inputs.metadata-annotations }}

  - name: Set up Docker Buildx
    # See https://github.com/docker/setup-buildx-action/commits/master/
    uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

  - name: Set Environment variables
    run: |
      DOCKER_LAYERS_PATH="/tmp/.buildx-cache-${{ inputs.image-name }}"
      echo "DOCKER_LAYERS_PATH=${DOCKER_LAYERS_PATH}" >> $GITHUB_ENV
      echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
    shell: bash

    # See https://github.com/docker/build-push-action/issues/252#issuecomment-744400434
  - name: Cache Docker layers
    # See https://github.com/actions/cache/commits/main/
    uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
    with:
      path: ${{ env.DOCKER_LAYERS_PATH }}
      key: ${{ runner.os }}-buildx-${{ inputs.image-name }}-${{ github.sha }}
      restore-keys: ${{ runner.os }}-buildx-${{ inputs.image-name }}

  - id: build-direct
    name: Build and push Docker image
    if: ${{ inputs.publish-mode == 'direct' }}
    # See https://github.com/docker/build-push-action/commits/master/
    uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
    with:
      context: ${{ inputs.docker-context }}
      file: ${{ inputs.docker-file }}
      push: true
      provenance: false
      tags: ${{ steps.meta.outputs.tags }}
      build-args: |
        BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
        ${{ inputs.docker-args }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
      outputs: ${{ inputs.docker-outputs }}
      cache-from: type=local,src=${{ env.DOCKER_LAYERS_PATH }}
      cache-to: type=local,dest=${{ env.DOCKER_LAYERS_PATH }}-new

  - name: Build local image for gated publication
    if: ${{ inputs.publish-mode == 'gated' }}
    # See https://github.com/docker/build-push-action/commits/master/
    uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
    with:
      context: ${{ inputs.docker-context }}
      file: ${{ inputs.docker-file }}
      load: true
      push: false
      provenance: false
      tags: ${{ steps.meta.outputs.tags }}
      build-args: |
        BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
        ${{ inputs.docker-args }}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: type=local,src=${{ env.DOCKER_LAYERS_PATH }}
      cache-to: type=local,dest=${{ env.DOCKER_LAYERS_PATH }}-new

  - name: Move Docker layers cache
    run: |
      rm -rf ${{ env.DOCKER_LAYERS_PATH }}
      mv ${{ env.DOCKER_LAYERS_PATH }}-new ${{ env.DOCKER_LAYERS_PATH }}
    shell: bash

  - id: local-image
    name: Record local image identity
    if: ${{ inputs.publish-mode == 'gated' }}
    env:
      DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
    run: |
      set -euo pipefail

      image_ref="$(printf '%s\n' "$DOCKER_TAGS" | while IFS= read -r tag; do if [[ -n "$tag" ]]; then printf '%s\n' "$tag"; break; fi; done)"
      if [[ -z "$image_ref" ]]; then
        printf 'docker/metadata-action generated no image tags\n' >&2
        exit 1
      fi
      config_digest="$(docker image inspect "$image_ref" --format '{{.Id}}')"
      printf 'image-ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
      printf 'config-digest=%s\n' "$config_digest" >> "$GITHUB_OUTPUT"
      {
        printf '### Container pre-publish evidence\n'
        printf -- '- Local image: `%s`\n' "$image_ref"
        printf -- '- Local image config digest: `%s`\n' "$config_digest"
      } >> "$GITHUB_STEP_SUMMARY"
    shell: bash

  - name: Run pre-push checks
    if: ${{ inputs.publish-mode == 'gated' && inputs.pre-push-command != '' }}
    env:
      IMAGE_CONFIG_DIGEST: ${{ steps.local-image.outputs.config-digest }}
      IMAGE_REF: ${{ steps.local-image.outputs.image-ref }}
      PRE_PUSH_COMMAND: ${{ inputs.pre-push-command }}
    run: bash -euo pipefail -c "$PRE_PUSH_COMMAND"
    shell: bash

  - id: gated-scan
    name: Scan local image before publishing
    if: ${{ inputs.publish-mode == 'gated' && inputs.trivy == 'true' }}
    continue-on-error: true
    # See https://github.com/aquasecurity/trivy-action/commits/master/
    uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
    with:
      image-ref: ${{ steps.local-image.outputs.image-ref }}
      format: sarif
      output: ${{ inputs.trivy-sarif-file }}
      exit-code: 1
      ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      severity: ${{ inputs.trivy-severity }}

  - name: Upload gated Trivy scan results
    if: ${{ always() && inputs.publish-mode == 'gated' && inputs.trivy == 'true' && inputs.upload-sarif == 'true' }}
    # See https://github.com/github/codeql-action/commits/main/
    uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
    with:
      sarif_file: ${{ inputs.trivy-sarif-file }}

  - name: Enforce gated Trivy result
    if: ${{ inputs.publish-mode == 'gated' && inputs.trivy == 'true' && steps.gated-scan.outcome != 'success' }}
    run: |
      printf 'The pre-publish Trivy scan failed; no registry tags were changed.\n' >&2
      exit 1
    shell: bash

  - name: Generate image SBOM
    if: ${{ inputs.publish-mode == 'gated' && inputs.sbom == 'true' }}
    # See https://github.com/aquasecurity/trivy-action/commits/master/
    uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
    with:
      image-ref: ${{ steps.local-image.outputs.image-ref }}
      format: spdx-json
      output: ${{ inputs.sbom-file }}
      exit-code: 0

  - id: sbom-output
    name: Record image SBOM path
    if: ${{ inputs.publish-mode == 'gated' && inputs.sbom == 'true' }}
    env:
      SBOM_FILE: ${{ inputs.sbom-file }}
    run: printf 'path=%s\n' "$SBOM_FILE" >> "$GITHUB_OUTPUT"
    shell: bash

  - name: Log in for gated publication
    if: ${{ inputs.publish-mode == 'gated' && inputs.registry-login == 'true' }}
    # See https://github.com/docker/login-action/commits/master/
    uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
    with:
      registry: ${{ inputs.registry-url }}
      username: ${{ inputs.registry-username }}
      password: ${{ inputs.registry-password }}

  - id: publish
    name: Push and verify gated image
    if: ${{ inputs.publish-mode == 'gated' }}
    env:
      DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
      IMAGE_CONFIG_DIGEST: ${{ steps.local-image.outputs.config-digest }}
      IMAGE_REF: ${{ steps.local-image.outputs.image-ref }}
    run: |
      set -euo pipefail

      verify_config_digest=true
      if ! command -v jq >/dev/null 2>&1; then
        verify_config_digest=false
        printf '::warning::jq is not installed; published image config digest verification will be skipped.\n'
      fi

      while IFS= read -r tag; do
        [[ -n "$tag" ]] || continue
        docker image push "$tag"
      done <<< "$DOCKER_TAGS"

      manifest_digest="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
      {
        printf '### Container publish evidence\n'
        printf -- '- Published primary image: `%s@%s`\n' "${IMAGE_REF%:*}" "$manifest_digest"
      } >> "$GITHUB_STEP_SUMMARY"

      while IFS= read -r tag; do
        [[ -n "$tag" ]] || continue
        published_manifest_digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
        if [[ "$verify_config_digest" == true ]]; then
          published_config_digest="$(docker buildx imagetools inspect "$tag" --raw | jq -er '.config.digest')"
          if [[ "$published_config_digest" != "$IMAGE_CONFIG_DIGEST" ]]; then
            printf 'Published digest mismatch for %s: local %s, published %s\n' "$tag" "$IMAGE_CONFIG_DIGEST" "$published_config_digest" >&2
            exit 1
          fi
          printf -- '- `%s`: manifest `%s`, config digest matches local `%s`\n' "$tag" "$published_manifest_digest" "$published_config_digest" >> "$GITHUB_STEP_SUMMARY"
        else
          printf -- '- `%s`: manifest `%s`, config digest verification skipped (`jq` unavailable)\n' "$tag" "$published_manifest_digest" >> "$GITHUB_STEP_SUMMARY"
        fi
      done <<< "$DOCKER_TAGS"

      printf 'manifest-digest=%s\n' "$manifest_digest" >> "$GITHUB_OUTPUT"
    shell: bash

  - id: attest-provenance
    name: Attest image provenance
    if: ${{ inputs.publish-mode == 'gated' && inputs.attest-provenance == 'true' }}
    # See https://github.com/actions/attest/commits/main/
    uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
    with:
      subject-name: ${{ inputs.registry-url }}/${{ inputs.image-name }}
      subject-digest: ${{ steps.publish.outputs.manifest-digest }}
      subject-version: ${{ steps.meta.outputs.version }}
      push-to-registry: ${{ inputs.attest-push-to-registry }}
      create-storage-record: ${{ inputs.attest-create-storage-record }}

  - name: Verify provenance storage record
    if: ${{ inputs.attest-provenance == 'true' && inputs.attest-create-storage-record == 'true' }}
    env:
      STORAGE_RECORD_IDS: ${{ steps.attest-provenance.outputs.storage-record-ids }}
    run: |
      if [[ -z "$STORAGE_RECORD_IDS" ]]; then
        printf 'GitHub did not create the requested provenance artifact storage record\n' >&2
        exit 1
      fi
    shell: bash

  - id: attest-sbom
    name: Attest image SBOM
    if: ${{ inputs.publish-mode == 'gated' && inputs.attest-sbom == 'true' }}
    # See https://github.com/actions/attest/commits/main/
    uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
    with:
      subject-name: ${{ inputs.registry-url }}/${{ inputs.image-name }}
      subject-digest: ${{ steps.publish.outputs.manifest-digest }}
      subject-version: ${{ steps.meta.outputs.version }}
      sbom-path: ${{ steps.sbom-output.outputs.path }}
      push-to-registry: ${{ inputs.attest-push-to-registry }}
      create-storage-record: ${{ inputs.attest-create-storage-record }}

  - name: Verify SBOM storage record
    if: ${{ inputs.attest-sbom == 'true' && inputs.attest-create-storage-record == 'true' }}
    env:
      STORAGE_RECORD_IDS: ${{ steps.attest-sbom.outputs.storage-record-ids }}
    run: |
      if [[ -z "$STORAGE_RECORD_IDS" ]]; then
        printf 'GitHub did not create the requested SBOM artifact storage record\n' >&2
        exit 1
      fi
    shell: bash

  - name: Run Trivy vulnerability scanner
    if: ${{ inputs.publish-mode == 'direct' && inputs.trivy == 'true' }}
    # See https://github.com/aquasecurity/trivy-action/commits/master/
    uses: aquasecurity/trivy-action@1bd062560b422f5944df1de50abd05162bea079e
    with:
      image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      format: json
      output: trivy-results.json

  - name: Convert Trivy JSON report into sarif
    if: ${{ inputs.publish-mode == 'direct' && inputs.trivy == 'true' }}
    run: |
      trivy convert --format sarif --output trivy-results.sarif trivy-results.json
      trivy convert --format table --output trivy-results.table trivy-results.json

      if [[ -s trivy-results.table ]]; then
        {
          echo "### Security Output"
          echo "<details><summary>Click to expand</summary>"
          echo ""
          echo '```markdown'
          cat trivy-results.table
          echo '```'
          echo "</details>"
        } >> $GITHUB_STEP_SUMMARY
      fi
    shell: bash

  - name: Upload Trivy scan results to GitHub Security tab
    if: ${{ inputs.publish-mode == 'direct' && inputs.trivy == 'true' && inputs.upload-sarif == 'true' }}
    # See https://github.com/github/codeql-action/commits/main/
    uses: github/codeql-action/upload-sarif@34950e1b113b30df4edee1a6d3a605242df0c40b
    with:
      sarif_file: trivy-results.sarif
      category: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
