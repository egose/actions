name: Install asdf
description: Install the asdf CLI on Linux and macOS runners

inputs:
  version:
    description: The version of asdf
    default: v0.20.0
    required: false
  github-token:
    description: GitHub token for authenticated api.github.com requests (avoids intermittent 403 from the 60 req/h unauthenticated quota)
    default: ${{ github.token }}
    required: false

runs:
  using: composite
  steps:
  - name: Cache asdf binary
    # See https://github.com/actions/cache/commits/main/
    uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
    with:
      path: ${{ runner.temp }}/asdf-bin
      key: asdf-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

  - name: Install asdf
    run: bash "${{ github.action_path }}/install.sh"
    shell: bash
    env:
      ASDF_VERSION: ${{ inputs.version }}
      GITHUB_TOKEN: ${{ inputs.github-token }}
