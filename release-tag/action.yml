name: Create Release Tag
description: Determines the next version and creates a release candidate PR
inputs:
  tag:
    description: Tag Version (e.g. 1.2.3). Leave empty to auto-determine.
    required: false
    default: ''
  github-token:
    description: GitHub Token for PR creation
    required: true
  auto-merge-pr:
    description: Automatically merge the generated release PR
    required: false
    default: 'false'
  delete-merged-branch:
    description: Delete the generated changelog branch after the PR is merged
    required: false
    default: 'false'
  release-it-path:
    description: Path to the release-it binary
    required: false
    default: ./node_modules/.bin/release-it
  git-user-name:
    description: Git author name used for the release commit
    required: false
    default: github-actions[bot]
  git-user-email:
    description: Git author email used for the release commit
    required: false
    default: github-actions[bot]@users.noreply.github.com
  sign-commit:
    description: Sign the release commit created by release-it
    required: false
    default: 'false'
  gpg-private-key:
    description: ASCII-armored GPG private key used to sign the release commit
    required: false
    default: ''
  gpg-passphrase:
    description: Passphrase for the GPG private key
    required: false
    default: ''

runs:
  using: composite
  steps:
  - name: Fail on tags (Workflow must run on a branch)
    shell: bash
    run: |
      echo "Current Ref: ${{ github.ref }}"
      if [[ ! "${{ github.ref }}" =~ ^refs/heads/ ]]; then
        echo "::error::This workflow must be run on a branch, not a tag."
        exit 1
      fi

  - name: Determine Next Tag Version
    id: new-tag
    shell: bash
    run: bash "${{ github.action_path }}/determine-tag.sh"
    env:
      RELEASE_TAG_INPUT: ${{ inputs.tag }}

  - name: Create Tag and Changelog with release-it
    id: release-it
    shell: bash
    env:
      RELEASE_TAG_VERSION: ${{ steps.new-tag.outputs.tag }}
      RELEASE_BASE_BRANCH: ${{ github.ref_name }}
      RELEASE_IT_PATH: ${{ inputs.release-it-path }}
      GIT_USER_NAME: ${{ inputs.git-user-name }}
      GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      SIGN_COMMIT: ${{ inputs.sign-commit }}
      GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
    run: bash "${{ github.action_path }}/create-release-pr-branch.sh"

  - name: Create Pull Request
    uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
    env:
      AUTO_MERGE_PR: ${{ inputs.auto-merge-pr }}
      DELETE_MERGED_BRANCH: ${{ inputs.delete-merged-branch }}
      HEAD_BRANCH: ${{ steps.release-it.outputs.head_branch }}
      BASE_BRANCH: ${{ steps.release-it.outputs.base_branch }}
      PR_TITLE: ${{ steps.release-it.outputs.pr_title }}
      PR_BODY: ${{ steps.release-it.outputs.pr_body }}
      VERSION: ${{ steps.release-it.outputs.version }}
    with:
      github-token: ${{ inputs.github-token }}
      script: |
        const { repo, owner } = context.repo;
        const autoMergePr = process.env.AUTO_MERGE_PR === 'true';
        const deleteMergedBranch = process.env.DELETE_MERGED_BRANCH === 'true';
        const headBranch = process.env.HEAD_BRANCH;
        const pr = await github.rest.pulls.create({
          owner,
          repo,
          head: headBranch,
          base: process.env.BASE_BRANCH,
          title: process.env.PR_TITLE,
          body: [
            '### Release Candidate Details',
            '',
            process.env.PR_BODY || '',
            '',
            '---',
            '',
            '> This PR was automatically generated.'
          ].join('\n')
        });
        await github.rest.issues.addLabels({
          owner,
          repo,
          issue_number: pr.data.number,
          labels: ['changelog', 'release-candidate', process.env.VERSION]
        });

        if (autoMergePr) {
          await github.rest.pulls.merge({
            owner,
            repo,
            pull_number: pr.data.number,
            merge_method: 'merge'
          });

          if (deleteMergedBranch) {
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${headBranch}`
            });
          }
        }
