name: Install Packages with PNPM
description: Install packages with pnpm based on the package.json file(s) located in the specified directories

inputs:
  paths:
    description: List of directories where file package.json located
    default: .
    required: false
  frozen:
    description: Run installs in strict lockfile mode
    default: 'false'
    required: false
  ignore-scripts:
    description: Do not run package lifecycle scripts during install
    default: 'false'
    required: false

runs:
  using: composite
  steps:
  - name: Get cache metadata
    run: |
      node_version="$(node --version)"
      echo "NODE_VERSION=${node_version#v}" >> "$GITHUB_ENV"
      echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"
    shell: bash

  - name: Cache pnpm store
    # see https://github.com/actions/cache/commits/main/
    uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
    with:
      path: ${{ env.STORE_PATH }}
      key: pnpm-${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      restore-keys: |
        pnpm-${{ runner.os }}-node-${{ env.NODE_VERSION }}-
        pnpm-${{ runner.os }}-

  - name: Install Packages
    run: bash "${{ github.action_path }}/../scripts/install-packages.sh"
    shell: bash
    env:
      PACKAGE_MANAGER: pnpm
      PACKAGE_FROZEN: ${{ inputs.frozen }}
      PACKAGE_IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      PACKAGE_PATHS: ${{ inputs.paths }}
