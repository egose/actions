name: Validate GitHub Actions

on:
  pull_request:
    paths:
    - .github/workflows/**
    - action.yml
    - '*/action.yml'
    - scripts/**
    - release-tag/**
  push:
    branches:
    - main
    paths:
    - .github/workflows/**
    - action.yml
    - '*/action.yml'
    - scripts/**
    - release-tag/**
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
