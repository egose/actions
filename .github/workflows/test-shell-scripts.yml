name: Test shell scripts

on:
  pull_request:
    paths:
    - .github/workflows/test-shell-scripts.yml
    - scripts/**
    - release-tag/**
    - tests/**
    - package.json
  push:
    branches:
    - main
    paths:
    - .github/workflows/test-shell-scripts.yml
    - scripts/**
    - release-tag/**
    - tests/**
    - package.json
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Run shell helper tests
      run: npm run test:shell
      shell: bash
