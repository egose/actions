name: Test shell scripts

on:
  pull_request:
    paths:
    - .github/workflows/test-shell-scripts.yml
    - scripts/**
    - release-tag/**
    - tests/**
    - package.json
  push:
    branches:
    - main
    paths:
    - .github/workflows/test-shell-scripts.yml
    - scripts/**
    - release-tag/**
    - tests/**
    - package.json
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Run shell helper tests
      run: npm run test:shell
      shell: bash
