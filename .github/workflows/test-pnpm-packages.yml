name: Test action pnpm-packages

on:
  pull_request:
    paths:
    - .github/workflows/test-pnpm-packages.yml
    - pnpm-packages/**
    - tests/fixtures/pnpm-packages/**
  push:
    branches:
    - main
    paths:
    - .github/workflows/test-pnpm-packages.yml
    - pnpm-packages/**
    - tests/fixtures/pnpm-packages/**
  workflow_dispatch:

jobs:
  pnpm-packages-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '26'

    - name: Enable Corepack
      run: corepack enable

    - name: Install package fixtures
      uses: ./pnpm-packages
      env:
        NODE_VERSION: ''
        STORE_PATH: ''
      with:
        paths: |
          tests/fixtures/pnpm-packages/app-one
          tests/fixtures/pnpm-packages/app-two

    - name: Verify pnpm install outputs
      shell: bash
      run: |
        test -f tests/fixtures/pnpm-packages/app-one/pnpm-lock.yaml
        test -f tests/fixtures/pnpm-packages/app-two/pnpm-lock.yaml

    - name: Reinstall package fixtures in frozen mode
      uses: ./pnpm-packages
      with:
        frozen: 'true'
        paths: |
          tests/fixtures/pnpm-packages/app-one
          tests/fixtures/pnpm-packages/app-two

    - name: Reinstall package fixtures ignoring scripts
      uses: ./pnpm-packages
      with:
        ignore-scripts: 'true'
        paths: |
          tests/fixtures/pnpm-packages/app-one
          tests/fixtures/pnpm-packages/app-two

    - name: Copy fixtures into paths with spaces
      shell: bash
      run: |
        mkdir -p "tests/fixtures/pnpm packages"
        cp -R tests/fixtures/pnpm-packages/app-one "tests/fixtures/pnpm packages/app one"
        cp -R tests/fixtures/pnpm-packages/app-two "tests/fixtures/pnpm packages/app two"

    - name: Install package fixtures from paths with spaces
      uses: ./pnpm-packages
      with:
        paths: |
          tests/fixtures/pnpm packages/app one
          tests/fixtures/pnpm packages/app two

    - name: Verify pnpm install outputs for paths with spaces
      shell: bash
      run: |
        test -f "tests/fixtures/pnpm packages/app one/pnpm-lock.yaml"
        test -f "tests/fixtures/pnpm packages/app two/pnpm-lock.yaml"
