name: Test action npm-packages

on:
  pull_request:
    paths:
    - .github/workflows/test-npm-packages.yml
    - npm-packages/**
    - tests/fixtures/npm-packages/**
  push:
    branches:
    - main
    paths:
    - .github/workflows/test-npm-packages.yml
    - npm-packages/**
    - tests/fixtures/npm-packages/**
  workflow_dispatch:

jobs:
  npm-packages-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '26'

    - name: Install package fixtures
      uses: ./npm-packages
      with:
        paths: |
          tests/fixtures/npm-packages/app-one
          tests/fixtures/npm-packages/app-two

    - name: Verify npm install outputs
      shell: bash
      run: |
        test -f tests/fixtures/npm-packages/app-one/package-lock.json
        test -f tests/fixtures/npm-packages/app-two/package-lock.json

    - name: Reinstall package fixtures in frozen mode
      uses: ./npm-packages
      with:
        frozen: 'true'
        paths: |
          tests/fixtures/npm-packages/app-one
          tests/fixtures/npm-packages/app-two

    - name: Reinstall package fixtures ignoring scripts
      uses: ./npm-packages
      with:
        ignore-scripts: 'true'
        paths: |
          tests/fixtures/npm-packages/app-one
          tests/fixtures/npm-packages/app-two

    - name: Copy fixtures into paths with spaces
      shell: bash
      run: |
        mkdir -p "tests/fixtures/npm packages"
        cp -R tests/fixtures/npm-packages/app-one "tests/fixtures/npm packages/app one"
        cp -R tests/fixtures/npm-packages/app-two "tests/fixtures/npm packages/app two"

    - name: Install package fixtures from paths with spaces
      uses: ./npm-packages
      with:
        paths: |
          tests/fixtures/npm packages/app one
          tests/fixtures/npm packages/app two

    - name: Verify npm install outputs for paths with spaces
      shell: bash
      run: |
        test -f "tests/fixtures/npm packages/app one/package-lock.json"
        test -f "tests/fixtures/npm packages/app two/package-lock.json"
