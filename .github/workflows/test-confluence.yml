name: Test action confluence

on:
  pull_request:
    paths:
    - .github/workflows/test-confluence.yml
    - confluence/**
    - tests/fixtures/confluence/**
  push:
    branches:
    - main
    paths:
    - .github/workflows/test-confluence.yml
    - confluence/**
    - tests/fixtures/confluence/**
  workflow_dispatch:

jobs:
  confluence-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '26'

    - name: Enable Corepack
      run: corepack enable

    - name: Install action repository dependencies
      run: pnpm install --frozen-lockfile

    - name: Dry-run the action against the fixture docs tree
      uses: ./confluence
      with:
        cwd: tests/fixtures/confluence
        folder: docs
        dry-run: 'true'

    - name: Verify dry-run output mentions both pages
      shell: bash
      run: |
        set -euo pipefail
        # Re-run the CLI directly to capture stdout (composite `uses:` steps don't
        # expose their stdout to later steps without an action output). The
        # previous step already validated the action's binary resolution; this
        # step simply greps the CLI's planning output for the expected pages.
        output="$( ( cd tests/fixtures/confluence && ../../node_modules/.bin/repo-toolkit-confluence --folder docs --dry-run ) 2>&1 )"
        echo "$output"
        grep -q 'index.md' <<<"$output"
        grep -q 'guide/intro.md' <<<"$output"

    - name: Real Confluence sync (only when the API token secret is present)
      if: ${{ vars.CONFLUENCE_RUN_LIVE == 'true' }}
      uses: ./confluence
      with:
        cwd: tests/fixtures/confluence
        folder: docs
        username: ${{ vars.CONFLUENCE_USERNAME }}
        api-token: ${{ secrets.CONFLUENCE_API_TOKEN }}
        confluence-base-url: ${{ vars.CONFLUENCE_BASE_URL }}
        space-key: ${{ vars.CONFLUENCE_SPACE_KEY }}
        parent-page-id: ${{ vars.CONFLUENCE_PARENT_PAGE_ID }}

    - name: Skip live Confluence sync (secret not set)
      if: ${{ vars.CONFLUENCE_RUN_LIVE != 'true' }}
      shell: bash
      run: |
        echo "::notice::CONFLUENCE_RUN_LIVE var is not 'true'; skipping live Confluence sync test."
        echo "The dry-run tests above already exercise the build + filesystem walk + CLI bootstrap."
