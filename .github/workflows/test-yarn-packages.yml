name: Test action yarn-packages

on:
  pull_request:
    paths:
    - .github/workflows/test-yarn-packages.yml
    - yarn-packages/**
    - tests/fixtures/yarn-packages/**
  push:
    branches:
    - main
    paths:
    - .github/workflows/test-yarn-packages.yml
    - yarn-packages/**
    - tests/fixtures/yarn-packages/**
  workflow_dispatch:

jobs:
  yarn-packages-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '26'

    - name: Enable Corepack
      run: corepack enable

    - name: Install package fixtures
      uses: ./yarn-packages
      with:
        paths: |
          tests/fixtures/yarn-packages/app-one
          tests/fixtures/yarn-packages/app-two

    - name: Verify yarn install outputs
      shell: bash
      run: |
        test -f tests/fixtures/yarn-packages/app-one/yarn.lock
        test -f tests/fixtures/yarn-packages/app-two/yarn.lock

    - name: Reinstall package fixtures in frozen mode
      uses: ./yarn-packages
      with:
        frozen: 'true'
        paths: |
          tests/fixtures/yarn-packages/app-one
          tests/fixtures/yarn-packages/app-two

    - name: Reinstall package fixtures ignoring scripts
      uses: ./yarn-packages
      with:
        ignore-scripts: 'true'
        paths: |
          tests/fixtures/yarn-packages/app-one
          tests/fixtures/yarn-packages/app-two

    - name: Copy fixtures into paths with spaces
      shell: bash
      run: |
        mkdir -p "tests/fixtures/yarn packages"
        cp -R tests/fixtures/yarn-packages/app-one "tests/fixtures/yarn packages/app one"
        cp -R tests/fixtures/yarn-packages/app-two "tests/fixtures/yarn packages/app two"

    - name: Install package fixtures from paths with spaces
      uses: ./yarn-packages
      with:
        paths: |
          tests/fixtures/yarn packages/app one
          tests/fixtures/yarn packages/app two

    - name: Verify yarn install outputs for paths with spaces
      shell: bash
      run: |
        test -f "tests/fixtures/yarn packages/app one/yarn.lock"
        test -f "tests/fixtures/yarn packages/app two/yarn.lock"
