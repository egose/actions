name: Release

on:
  push:
    tags:
    - v*.*.*

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
