name: Docker Image Build & Push
description: Build Docker image and push to a container registry

inputs:
  registry-url:
    description: Docker container registry server URL
    required: true
  registry-username:
    description: Docker container registry username
    required: false
  registry-password:
    description: Docker container registry password
    required: false
  registry-login:
    description: Log in to the container registry before publishing
    required: false
    default: 'true'
  image-name:
    description: Docker image name
    required: true
  metadata-tags:
    description: List of tags as key-value pair attributes
    required: true
  metadata-labels:
    description: List of labels as key-value pair attributes
    required: false
  metadata-annotations:
    description: List of annotations as key-value pair attributes
    required: false
  metadata-labels-annotations:
    description: List of key-value pair attributes applied to both labels and annotations
    required: false
  docker-context:
    description: Docker build's context
    required: false
  docker-file:
    description: Path to the Dockerfile
    required: false
  docker-args:
    description: List of build args as key-value pair attributes
    required: false
  docker-outputs:
    description: List of output destinations
    required: false
  publish-mode:
    description: Publication mode; direct preserves the original build-and-push behavior, gated scans a local single-platform image before pushing it
    required: false
    default: direct
  pre-push-command:
    description: Trusted shell command run against IMAGE_REF and IMAGE_CONFIG_DIGEST after the gated local build and before scanning or publishing
    required: false
  trivy:
    description: Run Trivy vulnerability scanner
    required: false
    default: 'false'
  trivy-severity:
    description: Comma-separated severities that fail a gated Trivy scan
    required: false
    default: HIGH,CRITICAL
  trivy-ignore-unfixed:
    description: Ignore vulnerabilities without fixes during a gated Trivy scan
    required: false
    default: 'true'
  trivy-sarif-file:
    description: Path for the Trivy SARIF report
    required: false
    default: trivy-results.sarif
  upload-sarif:
    description: Upload the Trivy SARIF report to GitHub code scanning
    required: false
    default: 'true'
  sbom:
    description: Generate an SPDX JSON SBOM from the gated local image
    required: false
    default: 'false'
  sbom-file:
    description: Path for the generated SPDX JSON SBOM
    required: false
    default: image-sbom.spdx.json

outputs:
  docker-version:
    description: Generated Docker image version
    value: ${{ steps.delegate.outputs.docker-version }}
  docker-tags:
    description: Generated Docker tags
    value: ${{ steps.delegate.outputs.docker-tags }}
  docker-labels:
    description: Generated Docker labels
    value: ${{ steps.delegate.outputs.docker-labels }}
  docker-annotations:
    description: Generated annotations
    value: ${{ steps.delegate.outputs.docker-annotations }}
  metadata-json:
    description: JSON output of tags and labels
    value: ${{ steps.delegate.outputs.metadata-json }}
  bake-file-tags:
    description: Bake definition file with tags
    value: ${{ steps.delegate.outputs.bake-file-tags }}
  bake-file-labels:
    description: Bake definition file with labels
    value: ${{ steps.delegate.outputs.bake-file-labels }}
  bake-file-annotations:
    description: Bake definition file with annotations
    value: ${{ steps.delegate.outputs.bake-file-annotations }}
  bake-file:
    description: Bake definition file with tags and labels
    value: ${{ steps.delegate.outputs.bake-file }}
  image-ref:
    description: Primary local image reference used by gated publication
    value: ${{ steps.delegate.outputs.image-ref }}
  image-config-digest:
    description: Config digest of the local image used by gated publication
    value: ${{ steps.delegate.outputs.image-config-digest }}
  manifest-digest:
    description: Published primary manifest digest
    value: ${{ steps.delegate.outputs.manifest-digest }}
  sbom-path:
    description: Path to the generated image SBOM when enabled
    value: ${{ steps.delegate.outputs.sbom-path }}

runs:
  using: composite
  steps:
  - id: delegate
    name: Delegate to docker-build-push
    uses: ./docker-build-push
    with:
      registry-url: ${{ inputs.registry-url }}
      registry-username: ${{ inputs.registry-username }}
      registry-password: ${{ inputs.registry-password }}
      registry-login: ${{ inputs.registry-login }}
      image-name: ${{ inputs.image-name }}
      metadata-tags: ${{ inputs.metadata-tags }}
      metadata-labels: ${{ inputs.metadata-labels }}
      metadata-annotations: ${{ inputs.metadata-annotations }}
      metadata-labels-annotations: ${{ inputs.metadata-labels-annotations }}
      docker-context: ${{ inputs.docker-context }}
      docker-file: ${{ inputs.docker-file }}
      docker-args: ${{ inputs.docker-args }}
      docker-outputs: ${{ inputs.docker-outputs }}
      publish-mode: ${{ inputs.publish-mode }}
      pre-push-command: ${{ inputs.pre-push-command }}
      trivy: ${{ inputs.trivy }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-sarif-file: ${{ inputs.trivy-sarif-file }}
      upload-sarif: ${{ inputs.upload-sarif }}
      sbom: ${{ inputs.sbom }}
      sbom-file: ${{ inputs.sbom-file }}
